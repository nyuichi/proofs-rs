name: Staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofs-rs-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ steps.resources.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Provision isolated staging resources
        id: resources
        run: node scripts/provision.mjs
        env:
          GITHUB_CLIENT_ID: ${{ vars.STAGING_GITHUB_CLIENT_ID }}
          ADMIN_GITHUB_IDS: ${{ vars.ADMIN_GITHUB_IDS }}
          EMAIL_FROM: ${{ vars.STAGING_EMAIL_FROM }}
          EMAIL_ALLOWLIST: ${{ vars.STAGING_EMAIL_ALLOWLIST }}
          EMAIL_DOMAIN: ${{ vars.STAGING_EMAIL_DOMAIN }}
          EMAIL_EVENT_SUBSCRIPTION: ${{ vars.STAGING_EMAIL_EVENT_SUBSCRIPTION }}
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.json
      - run: npx wrangler deploy --config wrangler.staging.json
      - name: Configure secrets without logging values
        run: node scripts/secrets.mjs
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.STAGING_GITHUB_CLIENT_SECRET }}
          TOKEN_SECRET: ${{ secrets.STAGING_TOKEN_SECRET }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      - name: Public read-only smoke check
        run: node scripts/smoke.mjs '${{ steps.resources.outputs.url }}'
      - name: Seed staging examples
        run: node scripts/seed-staging.mjs
      - name: Deployment summary
        run: |
          echo 'Staging deployed to ${{ steps.resources.outputs.url }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '[Approve production deployment](https://github.com/nyuichi/proofs-rs/actions/workflows/production.yml): nyuichi selects **Run workflow** on **main** after reviewing staging. Production requires a successful staging run for the exact selected commit.' >> "$GITHUB_STEP_SUMMARY"
