name: Production
# While private, Run workflow is the explicit production approval.
# Only nyuichi may approve; the exact selected SHA must have passed Staging.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: proofs-rs-production
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require owner approval and a successful staging deployment
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' ||
                context.ref !== 'refs/heads/main' ||
                process.env.GITHUB_ACTOR_ID !== '540144' ||
                process.env.GITHUB_TRIGGERING_ACTOR !== 'nyuichi') {
              throw new Error('Only nyuichi may approve production from main.');
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'deploy.yml',
              head_sha: context.sha,
              branch: 'main',
              status: 'success',
              per_page: 100,
            });
            const run = data.workflow_runs.find(run =>
              run.head_sha === context.sha &&
              run.head_branch === 'main' &&
              run.head_repository?.full_name === context.payload.repository.full_name &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.status === 'completed' && run.conclusion === 'success'
            );
            if (!run) {
              throw new Error('This exact commit has not passed Staging. Wait for Staging, then run Production again.');
            }
            await core.summary
              .addHeading('Production approved by nyuichi')
              .addRaw(`Commit: ${context.sha}\n\n`)
              .addLink('Successful staging deployment', run.html_url)
              .write();
  deploy:
    needs: authorize
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '540144' && github.triggering_actor == 'nyuichi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.resources.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      PRODUCTION_CUSTOM_DOMAIN: ${{ vars.PRODUCTION_CUSTOM_DOMAIN }}
      PRODUCTION_EMAIL_ENABLED: ${{ vars.PRODUCTION_EMAIL_ENABLED }}
      EMAIL_EVENT_SUBSCRIPTION: ${{ vars.PRODUCTION_EMAIL_EVENT_SUBSCRIPTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Provision isolated production resources
        id: resources
        run: node scripts/provision.mjs production
        env:
          GITHUB_CLIENT_ID: ${{ vars.PRODUCTION_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PRODUCTION_GITHUB_CLIENT_SECRET }}
          ADMIN_GITHUB_IDS: ${{ vars.ADMIN_GITHUB_IDS }}
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.json
      - run: npx wrangler deploy --config wrangler.production.json
      - name: Configure production secrets
        run: node scripts/secrets.mjs production
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.PRODUCTION_GITHUB_CLIENT_SECRET }}
          TOKEN_SECRET: ${{ secrets.PRODUCTION_TOKEN_SECRET }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      - name: Production read-only smoke check
        run: node scripts/smoke.mjs '${{ steps.resources.outputs.url }}' production
      - name: Inspect domain onboarding status
        run: node scripts/domain-status.mjs
      - name: Deployment summary
        run: echo 'Production Worker deployed to ${{ steps.resources.outputs.url }}. Check the domain/OAuth readiness summary before announcing launch.' >> "$GITHUB_STEP_SUMMARY"
