name: Deploy development
on:
  push:
    branches: [feat/crate-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/crate-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Prepare isolated Worker and D1
        run: node scripts/prepare-dev.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm build
        env:
          PROOFS_DEV_CONFIG: wrangler.dev.json
      - name: Migrate and seed development only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply proofs-rs-dev-db --remote --config wrangler.dev.json
          node scripts/seed-demo.mjs
          pnpm exec wrangler d1 execute proofs-rs-dev-db --remote --config wrangler.dev.json --file fixtures/demo.sql
      - name: Deploy development
        run: pnpm exec wrangler deploy --config build/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test development
        run: node scripts/smoke-dev.mjs
