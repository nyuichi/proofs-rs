name: Read-only D1 performance comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/db-round-trips' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Compare temporary read-only Workers against the same staging database
        run: node scripts/benchmark-remote.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: performance-results.json
