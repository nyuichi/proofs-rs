[book]
title = "proofs.rs Book"
language = "en"
src = "src"

[output.html]
additional-js = ["../public/account-navigation.js", "theme/account.js", "theme/sidebar-state.js"]
additional-css = ["theme/site-header.css"]
default-theme = "light"
preferred-dark-theme = "light"
site-url = "/book/"
no-section-label = true
smart-punctuation = false

[output.html.playground]
runnable = false

[output.html.print]
enable = false
