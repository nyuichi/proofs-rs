<div id="proofs-registry-mockup">
  <style>
    #proofs-registry-mockup{--proofs-paper:#fff;--proofs-ink:#171a18;--proofs-muted:#6e746f;--proofs-faint:#f4f5f3;--proofs-line:#d9ddd9;--proofs-line-dark:#aeb5af;--proofs-action:#245d46;--proofs-danger:#a72c27;--proofs-mono:"SFMono-Regular","Cascadia Mono","Roboto Mono",Consolas,monospace;--proofs-sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:var(--proofs-ink);font-family:var(--proofs-sans);width:100%}
    #proofs-registry-mockup *{box-sizing:border-box}#proofs-registry-mockup button,#proofs-registry-mockup input,#proofs-registry-mockup textarea{font:inherit}
    .proofs-shell{background:var(--proofs-paper);border:1px solid var(--proofs-line);min-height:760px}.proofs-header{align-items:center;border-bottom:1px solid var(--proofs-line-dark);display:flex;gap:30px;min-height:62px;padding:0 28px}.proofs-brand{background:transparent;border:0;color:var(--proofs-ink);cursor:pointer;font-family:var(--proofs-mono);font-size:17px;font-weight:500;padding:8px 0}.proofs-nav{display:flex;gap:22px}.proofs-nav button,.proofs-auth{background:transparent;border:0;color:var(--proofs-muted);cursor:pointer;font-size:13px;min-height:42px;padding:0}.proofs-nav button[aria-current="page"]{color:var(--proofs-ink);text-decoration:underline;text-underline-offset:7px}.proofs-auth{margin-left:auto}.proofs-auth:hover,.proofs-nav button:hover{color:var(--proofs-ink)}
    .proofs-main{margin:0 auto;max-width:900px;padding:54px 34px 70px}.proofs-heading{margin-bottom:37px}.proofs-heading h1{font-size:31px;font-weight:500;letter-spacing:-.04em;line-height:1.1;margin:0}.proofs-heading p{color:var(--proofs-muted);font-size:13px;margin:10px 0 0}
    .proofs-list{border-top:1px solid var(--proofs-line-dark)}.proofs-entry{background:transparent;border:0;border-bottom:1px solid var(--proofs-line);color:var(--proofs-ink);cursor:pointer;display:block;padding:27px 2px 29px;text-align:left;transition:background-color 140ms ease,padding 140ms ease;width:100%}.proofs-entry:hover{background:var(--proofs-faint);padding-left:12px;padding-right:12px}.proofs-entry-head{align-items:baseline;display:flex;gap:15px;justify-content:space-between}.proofs-subject{font-size:15px;font-weight:500}.proofs-byline{color:var(--proofs-muted);font-size:12px;white-space:nowrap}.proofs-title{font-size:17px;margin:18px 0 17px}.proofs-tags{align-items:center;display:flex;flex-wrap:wrap;gap:7px}.proofs-tag{background:var(--proofs-faint);font-family:var(--proofs-mono);font-size:11px;padding:4px 6px}.proofs-more{color:var(--proofs-muted);font-size:11px}.proofs-load{background:transparent;border:1px solid var(--proofs-line-dark);color:var(--proofs-ink);cursor:pointer;display:block;margin:28px auto 0;padding:9px 18px}
    .proofs-back{background:transparent;border:0;color:var(--proofs-muted);cursor:pointer;font-size:12px;margin:0 0 30px;padding:0}.proofs-detail-top{border-bottom:1px solid var(--proofs-line-dark);padding-bottom:34px}.proofs-detail-subject-row{align-items:baseline;display:flex;gap:16px;justify-content:space-between}.proofs-detail-message{font-size:25px;font-weight:500;letter-spacing:-.035em;line-height:1.2;margin:24px 0 17px}.proofs-detail-body{color:#3e443f;font-size:14px;line-height:1.7;margin:0;max-width:680px;white-space:pre-line}.proofs-section{border-bottom:1px solid var(--proofs-line-dark);padding:38px 0}.proofs-section h2{font-size:14px;font-weight:500;margin:0 0 26px}.proofs-target+.proofs-target{border-top:1px solid var(--proofs-line);margin-top:31px;padding-top:31px}.proofs-target-name{font-family:var(--proofs-mono);font-size:13px;font-weight:500;margin:0 0 12px;overflow-wrap:anywhere}.proofs-rule{border-top:1px solid var(--proofs-line)}.proofs-rule-toggle{align-items:center;background:transparent;border:0;color:var(--proofs-ink);cursor:pointer;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) auto;padding:14px 2px;text-align:left;width:100%}.proofs-rule-id{font-family:var(--proofs-mono);font-size:12px;overflow-wrap:anywhere}.proofs-tool{color:var(--proofs-muted);font-family:var(--proofs-mono);font-size:11px;white-space:nowrap}.proofs-description{background:var(--proofs-faint);padding:16px 18px 18px}.proofs-description p{color:#414742;font-size:13px;line-height:1.65;margin:0}.proofs-description p+p{margin-top:9px}.proofs-location{color:var(--proofs-muted)!important;font-family:var(--proofs-mono);font-size:11px!important}
    .proofs-provenance{display:grid;gap:34px;grid-template-columns:1fr 1fr}.proofs-provenance h3{color:var(--proofs-muted);font-size:11px;font-weight:500;letter-spacing:.08em;margin:0 0 10px;text-transform:uppercase}.proofs-provenance a{color:var(--proofs-action);font-family:var(--proofs-mono);font-size:12px;overflow-wrap:anywhere}.proofs-provenance p{color:var(--proofs-muted);font-family:var(--proofs-mono);font-size:11px;margin:8px 0 0;overflow-wrap:anywhere}.proofs-run{border-top:1px solid var(--proofs-line);padding:15px 0}.proofs-run-head{align-items:center;display:flex;gap:16px;justify-content:space-between}.proofs-run-name{font-family:var(--proofs-mono);font-size:12px}.proofs-raw-toggle{background:transparent;border:0;color:var(--proofs-action);cursor:pointer;font-size:11px;padding:3px 0}.proofs-raw{background:#f6f7f5;border-left:2px solid var(--proofs-line-dark);font-family:var(--proofs-mono);font-size:11px;line-height:1.55;margin:13px 0 0;overflow-wrap:anywhere;padding:16px;white-space:pre-wrap}
    .proofs-form{border-top:1px solid var(--proofs-line-dark)}.proofs-form-section{border-bottom:1px solid var(--proofs-line);padding:29px 0 32px}.proofs-form-section h2{font-size:14px;font-weight:500;margin:0 0 20px}.proofs-fields{display:grid;gap:17px;grid-template-columns:1fr 1fr}.proofs-wide{grid-column:1/-1}.proofs-field label{color:var(--proofs-muted);display:block;font-size:11px;margin-bottom:7px}.proofs-field input,.proofs-field textarea{background:var(--proofs-paper);border:1px solid var(--proofs-line-dark);border-radius:0;color:var(--proofs-ink);padding:10px 11px;width:100%}.proofs-field textarea{line-height:1.55;min-height:105px;resize:vertical}.proofs-field textarea.proofs-sarif{font-family:var(--proofs-mono);font-size:11px;min-height:280px}.proofs-note{color:var(--proofs-muted);font-size:11px;margin:9px 0 0}.proofs-error{color:var(--proofs-danger);font-size:12px;margin:22px 0 0}.proofs-submit{background:var(--proofs-ink);border:1px solid var(--proofs-ink);color:var(--proofs-paper);cursor:pointer;margin-top:24px;padding:11px 22px}
    @media(max-width:620px){.proofs-header{flex-wrap:wrap;gap:12px 20px;padding:13px 17px}.proofs-auth{font-size:11px}.proofs-nav{gap:15px;order:3;width:100%}.proofs-nav button{min-height:28px}.proofs-main{padding:38px 17px 55px}.proofs-heading{margin-bottom:28px}.proofs-entry-head,.proofs-detail-subject-row{align-items:flex-start;display:block}.proofs-byline{display:block;margin-top:7px;white-space:normal}.proofs-title{margin-top:15px}.proofs-provenance,.proofs-fields{grid-template-columns:1fr}.proofs-wide{grid-column:auto}.proofs-detail-message{font-size:22px}}
  </style>
  <div class="proofs-shell"><header class="proofs-header"><button class="proofs-brand" id="proofs-brand" type="button">proofs.rs</button><nav class="proofs-nav" aria-label="Primary navigation"><button id="proofs-publications-nav" type="button" aria-current="page">Publications</button><button id="proofs-publish-nav" type="button">Publish</button></nav><button class="proofs-auth" id="proofs-auth" type="button">Log in with GitHub</button></header><main class="proofs-main" id="proofs-main" aria-live="polite"></main></div>
  <script>
    (()=>{
      const root=document.getElementById("proofs-registry-mockup"),main=document.getElementById("proofs-main"),pubNav=document.getElementById("proofs-publications-nav"),publishNav=document.getElementById("proofs-publish-nav"),brand=document.getElementById("proofs-brand"),auth=document.getElementById("proofs-auth");if(!root||!main||!pubNav||!publishNav||!brand||!auth)return;
      const runA={tool:{driver:{name:"kani",version:"0.66.0",rules:[{id:"no_duplicate_permits",shortDescription:{text:"Semaphore permits are never duplicated"},fullDescription:{text:"Every live permit represents a distinct unit of semaphore capacity in every reachable execution of the bounded harness."}},{id:"permit_count_bounded",shortDescription:{text:"Permit count stays within capacity"},fullDescription:{text:"Outstanding permits never exceed configured capacity."}},{id:"owned_permit_release",shortDescription:{text:"Owned permits release capacity exactly once"},fullDescription:{text:"Dropping an owned permit restores one unit of capacity and cannot restore it twice."}}]}},results:[{ruleId:"no_duplicate_permits",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"tokio::sync::Semaphore::acquire"}],physicalLocation:{artifactLocation:{uri:"verification/semaphore.rs"},region:{startLine:142}}}]},{ruleId:"permit_count_bounded",ruleIndex:1,locations:[{logicalLocations:[{fullyQualifiedName:"tokio::sync::Semaphore::acquire"}],physicalLocation:{artifactLocation:{uri:"verification/semaphore.rs"},region:{startLine:188}}}]},{ruleId:"no_duplicate_permits",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"tokio::sync::Semaphore::try_acquire"}],physicalLocation:{artifactLocation:{uri:"verification/semaphore.rs"},region:{startLine:241}}}]},{ruleId:"owned_permit_release",ruleIndex:2,locations:[]}]};
      const runB={tool:{driver:{name:"creusot",version:"0.4.0",rules:[{id:"no_duplicate_permits",shortDescription:{text:"Semaphore permits are never duplicated"},fullDescription:{text:"The logical ownership model assigns every permit token to at most one live value."}},{id:"wakeups_preserve_capacity",shortDescription:{text:"Wakeups preserve semaphore capacity"},fullDescription:{text:"Waking queued tasks cannot create or lose semaphore capacity."}}]}},results:[{ruleId:"no_duplicate_permits",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"tokio::sync::Semaphore::acquire"}],physicalLocation:{artifactLocation:{uri:"proofs/semaphore.rs"},region:{startLine:76}}}]},{ruleId:"wakeups_preserve_capacity",ruleIndex:1,locations:[{logicalLocations:[{fullyQualifiedName:"tokio::sync::Semaphore::add_permits"}]}]}]};
      let publications=[
        {id:"01K3TOKIO",crate:"tokio",version:"1.48.0",publisher:"alice",age:"2 days ago",message:"Verify semaphore permit accounting\n\nThis publication checks permit ownership and capacity accounting across acquire, try_acquire, release, and wakeup paths.",upstreamRepo:"tokio-rs/tokio",upstreamCommit:"9b8e7f6a4d2c1e0f",upstreamPath:"tokio/src/sync/semaphore.rs",verificationRepo:"alice/tokio-verification",verificationCommit:"c41f087e9d2b6a10",verificationPath:"verification/",runs:[runA,runB]},
        {id:"01K3CROSS",crate:"crossbeam-channel",version:"0.5.15",publisher:"leah",age:"4 days ago",message:"Check bounded channel state transitions\n\nCovers send, receive, close, and capacity transitions.",upstreamRepo:"crossbeam-rs/crossbeam",upstreamCommit:"be4d310c9a",upstreamPath:"crossbeam-channel/",verificationRepo:"leah/channel-proofs",verificationCommit:"7e2d9aa31f",verificationPath:"proofs/",runs:[{tool:{driver:{name:"verus",version:"0.2026.08",rules:[{id:"send_is_linearizable",shortDescription:{text:"Successful sends have one linearization point"},fullDescription:{text:"Every successful send is consistent with one FIFO history."}},{id:"capacity_never_underflows",shortDescription:{text:"Channel capacity never underflows"},fullDescription:{text:"All reachable states have non-negative remaining capacity."}}]}},results:[{ruleId:"send_is_linearizable",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"crossbeam_channel::Sender::send"}]}]},{ruleId:"capacity_never_underflows",ruleIndex:1,locations:[]}]}]},
        {id:"01K3SERDE",crate:"serde_json",version:"1.0.140",publisher:"mori",age:"1 week ago",message:"Verify parser boundary behavior",upstreamRepo:"serde-rs/json",upstreamCommit:"6a2e87b1",upstreamPath:"src/de.rs",verificationRepo:"mori/serde-json-kani",verificationCommit:"f0b24c1",verificationPath:"kani/",runs:[{tool:{driver:{name:"kani",version:"0.66.0",rules:[{id:"rejects_trailing_bytes",shortDescription:{text:"Trailing non-whitespace bytes are rejected"},fullDescription:{text:"A complete parsed value cannot be followed by a non-whitespace byte."}}]}},results:[{ruleId:"rejects_trailing_bytes",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"serde_json::from_slice"}]}]}]}]},
        {id:"01K3ANY",crate:"anyhow",version:"1.0.98",publisher:"riku",age:"2 weeks ago",message:"Exercise error ownership paths",upstreamRepo:"dtolnay/anyhow",upstreamCommit:"0c3b7af0",upstreamPath:"src/error.rs",verificationRepo:"riku/anyhow-miri",verificationCommit:"3d98d4e",verificationPath:"tests/",runs:[{tool:{driver:{name:"miri",version:"nightly-2026-08-20",rules:[{id:"drop_does_not_double_free",shortDescription:{text:"Drop releases ownership exactly once"},fullDescription:{text:"The exercised paths contain no invalid free or use-after-free."}}]}},results:[{ruleId:"drop_does_not_double_free",ruleIndex:0,locations:[]}]}]},
        {id:"01K3RG",crate:"ripgrep",version:"14.1.0",publisher:"aya",age:"3 weeks ago",message:"Check matcher aliasing invariants",upstreamRepo:"BurntSushi/ripgrep",upstreamCommit:"4ce1b0ac",upstreamPath:"crates/",verificationRepo:"aya/rg-verification",verificationCommit:"0a31fa2",verificationPath:"proof/",runs:[{tool:{driver:{name:"creusot",version:"0.4.0",rules:[{id:"no_unsafe_aliasing",shortDescription:{text:"Mutable references do not alias"},fullDescription:{text:"The matcher preserves exclusive mutable access."}}]}},results:[{ruleId:"no_unsafe_aliasing",ruleIndex:0,locations:[{logicalLocations:[{fullyQualifiedName:"grep::matcher::Matcher"}]}]}]}]}
      ];
      let visible=3,loggedIn=false;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);const parts=m=>{const l=String(m).split("\n");return{title:l[0]||"Untitled publication",body:l.slice(l[1]===""?2:1).join("\n").trim()}};const ids=p=>p.runs.flatMap(r=>(r.results||[]).map(x=>x.ruleId).filter(Boolean));const setNav=p=>{pubNav.setAttribute("aria-current",p==="publications"?"page":"false");publishNav.setAttribute("aria-current",p==="publish"?"page":"false")};
      function renderList(){setNav("publications");const rows=publications.slice(0,visible).map(p=>{const m=parts(p.message),r=ids(p);return`<button class="proofs-entry" type="button" data-publication="${esc(p.id)}"><span class="proofs-entry-head"><span class="proofs-subject">${esc(p.crate)} ${esc(p.version)}</span><span class="proofs-byline">by ${esc(p.publisher)} · ${esc(p.age)}</span></span><span class="proofs-title">${esc(m.title)}</span><span class="proofs-tags">${r.slice(0,3).map(id=>`<span class="proofs-tag">[${esc(id)}]</span>`).join("")}${r.length>3?`<span class="proofs-more">${r.length-3} more rules</span>`:""}</span></button>`}).join("");main.innerHTML=`<div class="proofs-heading"><h1>Publications</h1><p>Published verification records, newest first.</p></div><div class="proofs-list">${rows}</div>${visible<publications.length?`<button class="proofs-load" id="proofs-load" type="button">Load more</button>`:""}`;main.querySelectorAll("[data-publication]").forEach(b=>b.addEventListener("click",()=>renderDetail(b.getAttribute("data-publication"))));document.getElementById("proofs-load")?.addEventListener("click",()=>{visible+=2;renderList()})}
      const locationText=l=>{const p=l?.physicalLocation;if(!p?.artifactLocation?.uri)return"";return`${p.artifactLocation.uri}${p.region?.startLine?`:${p.region.startLine}`:""}`};
      function grouped(p){const g=new Map();p.runs.forEach((r,ri)=>{const d=r.tool?.driver||{},des=d.rules||[];(r.results||[]).forEach((x,xi)=>{const rule=Number.isInteger(x.ruleIndex)?des[x.ruleIndex]:des.find(v=>v.id===x.ruleId);const ls=x.locations?.length?x.locations:[{}];ls.forEach((l,li)=>{const logical=l.logicalLocations?.[0],target=logical?.fullyQualifiedName||logical?.name||"Target not specified";if(!g.has(target))g.set(target,[]);g.get(target).push({key:`${ri}-${xi}-${li}`,id:x.ruleId,short:rule?.shortDescription?.text||"",full:rule?.fullDescription?.text||"",tool:d.name||"unknown",version:d.version||"",location:locationText(l)})})})});const e=[...g.entries()];return[...e.filter(([t])=>t!=="Target not specified"),...e.filter(([t])=>t==="Target not specified")]}
      function renderDetail(id){setNav("detail");const p=publications.find(x=>x.id===id);if(!p)return renderList();const m=parts(p.message);const targets=grouped(p).map(([target,rules])=>`<div class="proofs-target"><h3 class="proofs-target-name">${esc(target)}</h3>${rules.map(r=>`<div class="proofs-rule"><button class="proofs-rule-toggle" type="button" aria-expanded="false" data-rule="${esc(r.key)}"><span class="proofs-rule-id">${esc(r.id)}</span><span class="proofs-tool">${esc(r.tool)}${r.version?` ${esc(r.version)}`:""}</span></button><div class="proofs-description" id="proofs-rule-${esc(r.key)}" hidden>${r.short?`<p>${esc(r.short)}</p>`:""}${r.full?`<p>${esc(r.full)}</p>`:""}${r.location?`<p class="proofs-location">Source · ${esc(r.location)}</p>`:""}${!r.short&&!r.full&&!r.location?`<p>No description or source location supplied.</p>`:""}</div></div>`).join("")}</div>`).join("");const runs=p.runs.map((r,i)=>{const d=r.tool?.driver||{};return`<div class="proofs-run"><div class="proofs-run-head"><span class="proofs-run-name">${esc(d.name||"unknown")}${d.version?` ${esc(d.version)}`:""}</span><button class="proofs-raw-toggle" type="button" aria-expanded="false" data-raw="${i}">View SARIF JSON</button></div><pre class="proofs-raw" id="proofs-raw-${i}" hidden>${esc(JSON.stringify(r,null,2))}</pre></div>`}).join("");main.innerHTML=`<button class="proofs-back" id="proofs-back" type="button">← Publications</button><article><header class="proofs-detail-top"><div class="proofs-detail-subject-row"><span class="proofs-subject">${esc(p.crate)} ${esc(p.version)}</span><span class="proofs-byline">by ${esc(p.publisher)} · ${esc(p.age)}</span></div><h1 class="proofs-detail-message">${esc(m.title)}</h1>${m.body?`<p class="proofs-detail-body">${esc(m.body)}</p>`:""}</header><section class="proofs-section"><h2>Verified targets and rules</h2>${targets}</section><section class="proofs-section"><h2>Source provenance</h2><div class="proofs-provenance"><div><h3>Upstream</h3><a href="https://github.com/${esc(p.upstreamRepo)}/tree/${esc(p.upstreamCommit)}/${esc(p.upstreamPath)}" target="_blank" rel="noreferrer">${esc(p.upstreamRepo)}</a><p>${esc(p.upstreamCommit)}<br>${esc(p.upstreamPath)}</p></div><div><h3>Verification source</h3><a href="https://github.com/${esc(p.verificationRepo)}/tree/${esc(p.verificationCommit)}/${esc(p.verificationPath)}" target="_blank" rel="noreferrer">${esc(p.verificationRepo)}</a><p>${esc(p.verificationCommit)}<br>${esc(p.verificationPath)}</p></div></div></section><section class="proofs-section"><h2>Runs</h2>${runs}</section></article>`;document.getElementById("proofs-back")?.addEventListener("click",renderList);main.querySelectorAll("[data-rule]").forEach(b=>b.addEventListener("click",()=>{const e=document.getElementById(`proofs-rule-${b.getAttribute("data-rule")}`),open=b.getAttribute("aria-expanded")==="true";if(e){b.setAttribute("aria-expanded",String(!open));e.hidden=open}}));main.querySelectorAll("[data-raw]").forEach(b=>b.addEventListener("click",()=>{const e=document.getElementById(`proofs-raw-${b.getAttribute("data-raw")}`),open=b.getAttribute("aria-expanded")==="true";if(e){b.setAttribute("aria-expanded",String(!open));b.textContent=open?"View SARIF JSON":"Hide SARIF JSON";e.hidden=open}}))}
